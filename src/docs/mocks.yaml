paths:
  /api/mocks/mockingusers:
    get:
      summary: Generar usuarios simulados (no persiste en la base)
      tags:
        - Mocks
      parameters:
        - name: count
          in: query
          required: false
          description: Cantidad de usuarios a generar. Debe ser un entero mayor a 0. Si no se envía, usa 10 por defecto.
          schema:
            type: integer
            example: 5
      responses:
        "200":
          description: Usuarios simulados generados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  count:
                    type: integer
                    example: 5
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        "400":
          description: La cantidad solicitada no es un entero mayor a 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

