paths:
  /api/orders:
    get:
      summary: Obtener todos los pedidos
      tags:
        - Orders
      responses:
        "200":
          description: Lista de pedidos obtenida correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Crear un nuevo pedido
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer
                - items
                - deliveryAddress
              properties:
                customer:
                  type: string
                  description: ID del usuario que realiza el pedido
                  example: 665f4d0a8f9a1b001234abcd
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/OrderItem'
                deliveryAddress:
                  type: string
                  example: Av. Siempre Viva 742
                priority:
                  type: string
                  enum: [low, normal, high]
                  example: normal
      responses:
        "201":
          description: Pedido creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  shippingCost:
                    type: number
                    example: 20
                  message:
                    type: string
                    example: Pedido creado y email enviado
        "400":
          description: Faltan datos obligatorios (cliente, items o dirección de entrega)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "403":
          description: Los usuarios con rol driver no pueden crear pedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: El usuario indicado como cliente no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{oid}:
    get:
      summary: Obtener un pedido por ID
      tags:
        - Orders
      parameters:
        - name: oid
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
      responses:
        "200":
          description: Pedido obtenido correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Eliminar un pedido por ID
      tags:
        - Orders
      parameters:
        - name: oid
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
      responses:
        "200":
          description: Pedido eliminado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/orders/{oid}/status:
    patch:
      summary: Actualizar el estado de un pedido
      tags:
        - Orders
      parameters:
        - name: oid
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [created, assigned, picked_up, in_transit, delivered, cancelled]
                  example: in_transit
      responses:
        "200":
          description: Estado del pedido actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "400":
          description: El estado es obligatorio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "409":
          description: El pedido ya fue entregado y no puede modificarse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'